; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
test_ignore = *
check_tool =
    cppcheck
    clangtidy
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression
    clangtidy: --checks=-*,boost-*,bugprone-*,cert-*,clang-analyzer-*,concurrency-*,cppcoreguidelines-*,google-*,hicpp-*,llvm-*,llvmlibc-*,misc-*,modernize-*,performance-*,portability-*,readability-*,*,-bugprone-easily-swappable-parameters,-clang-diagnostic-pragma-pack,-cppcoreguidelines-avoid-non-const-global-variables,-cppcoreguidelines-init-variables,-hicpp-signed-bitwise,-llvm-header-guard,-llvmlibc-callee-namespace,-llvmlibc-implementation-in-namespace,-llvmlibc-restrict-system-libc-headers,-modernize-use-trailing-return-type,-readability-convert-member-functions-to-static,-readability-identifier-length,-readability-implicit-bool-conversion,-readability-redundant-access-specifiers,-altera-id-dependent-backward-branch,-altera-struct-pack-align,-altera-unroll-loops --fix
check_skip_packages = yes
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
    +<test/test_native/*>
lib_deps =
    ;martinbudden/VectorQuaternionMatrix@^0.4.10
    https://github.com/martinbudden/Library-VectorQuaternionMatrix.git
    ;martinbudden/SensorFusion@^0.2.14
    https://github.com/martinbudden/Library-SensorFusion.git
    ;martinbudden/Sensors@^0.0.6
    https://github.com/martinbudden/Library-Sensors.git
    martinbudden/TaskUtilities@^0.0.1
    ;martinbudden/StabilizedVehicle@^0.5.25
    https://github.com/martinbudden/Library-StabilizedVehicle.git
    ;martinbudden/Receivers@^0.0.1
    https://github.com/martinbudden/Library-Receivers.git
    ;../../Libraries/Library-Receivers
build_unflags =
    -std=gnu++11
    -std=gnu++17
    -Os
build_flags =
    -O2
    -std=gnu++20
    ;!python platformio_git_revision.py
    ;-D BUILD_TIME_UNIX=$UNIX_TIME
    ;-save-temps=obj
    -Werror
    -Wall
    -Wextra
    -Waggressive-loop-optimizations
    -Wattributes
    -Wcast-align
    -Wconversion
    -Wdeprecated-declarations
    -Wdisabled-optimization
    -Wdouble-promotion
    -Wfloat-conversion
    -Wignored-qualifiers
    -Wimplicit-fallthrough
    -Winline
    ;-Wmissing-braces
    -Wmissing-declarations
    -Wmissing-noreturn
    -Wnarrowing
    ;-Wnon-virtual-dtor
    ;-Wpacked
    ;-Wpadded
    -Wpedantic
    -Wredundant-decls
    -Wshadow
    -Wsign-compare
    ;-Wsign-conversion
    -Wstrict-aliasing
    ;-Wstrict-aliasing=2
    -Wtrampolines
    -Wunsafe-loop-optimizations
    -Wunreachable-code
    -Wunused
    -Wunused-function
    -Wunused-parameter
    -Wunused-value
    -Wunreachable-code

[env:native]
platform = native
lib_deps =
    ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -Og
    -D FRAMEWORK_TEST
    -D LIBRARY_BACKCHANNEL_USE_EMPTY_MAIN

[env:unit-test]
platform = native
build_type = test
test_ignore = test_embedded
test_filter = test_native/test_*
check_tool =
check_flags =
lib_deps =
    ${env.lib_deps}
test_build_src = true
build_unflags = -Os
build_flags =
    -O2
    -D FRAMEWORK_TEST
    -D UNIT_TEST_BUILD

[platformio]
description = Backchannel library
